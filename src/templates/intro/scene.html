<template>
  <style>
    {{{baseCss}}}
    {{{backgroundCss}}}
    #{{prefix}}-content { align-items: flex-start; }
    #{{prefix}}-title { font-size: {{titleSize}}px; text-transform: uppercase; line-height: 1.34; transform-origin: 0% 50%; text-shadow: none; }
    #{{prefix}}-subtitle { font-size: {{subtitleSize}}px; margin: 0; max-width: 92%; }
  </style>
  <div id="root" data-composition-id="{{id}}" data-width="{{width}}" data-height="{{height}}">
    {{{background}}}
    <div id="{{prefix}}-content" class="content">
      {{{title}}}
      <p id="{{prefix}}-subtitle" class="support outlined">{{subtitle}}</p>
    </div>
  </div>
  <script>
    (function () {
      var tl = gsap.timeline({ paused: true });
      {{{backgroundTweens}}}
      // Frame 0 is the thumbnail: the hook is already readable, then snaps into place.
      if (document.getElementById("{{prefix}}-title")) {
        tl.fromTo("#{{prefix}}-title", { opacity: 1, scale: 0.9, rotation: -5 }, { opacity: 1, scale: 1, rotation: -2, duration: 0.45, ease: "back.out(2.4)" }, 0);
      }
      tl.fromTo("#{{prefix}}-subtitle", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.35, ease: "power2.out" }, 0.3);
      {{{exitTween}}}
      window.__timelines["{{id}}"] = tl;
    })();
  </script>
</template>
